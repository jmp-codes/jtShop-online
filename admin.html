<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jT Shop Admin</title>
<meta name="description" content="Statistics, inventory and orders for jT Shop.">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<header class="site-header">
  <a class="brand" href="index.html">jT <span>Shop</span></a>
  <nav class="site-nav"><span class="helper" style="font-weight:700;color:var(--accent)">Admin</span></nav>
  <div class="header-actions"><span id="acct" class="acct"></span></div>
</header>

<main id="app" class="app">
  <div class="admin-topbar">
    <h1 style="margin:0">Admin</h1>
    <a href="index.html">← Back to shop</a>
  </div>
  <div class="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="orders">Orders</button>
    <button data-tab="products">Inventory</button>
  </div>
  <div id="admin-body"><p class="helper">Loading…</p></div>
</main>

<footer class="site-footer">jT Shop · admin</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
