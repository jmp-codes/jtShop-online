<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jT Shop</title>
<meta name="description" content="Order baby care essentials online — stock updates live.">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
#page-loader{position:fixed;inset:0;background:#f7f5fc;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .35s ease}
#page-loader.hide{opacity:0;pointer-events:none}
.page-loader-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
.page-loader-icon{width:72px;height:86px;animation:jt-bounce 1.1s ease-in-out infinite}
.page-loader-text{font-family:system-ui,-apple-system,sans-serif;font-weight:700;font-size:20px;color:#7c6ac2;letter-spacing:.3px}
@keyframes jt-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-color-scheme:dark){#page-loader{background:#170f28}.page-loader-text{color:#b794f4}}
</style>
</head>
<body>
<div id="page-loader" class="page-loader" aria-hidden="true">
  <div class="page-loader-inner">
    <svg class="page-loader-icon" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
      <path d="M74 86 Q74 40 100 40 Q126 40 126 86" stroke="#a78bfa" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M46 96 L154 96 L142 216 Q140 228 128 228 L72 228 Q60 228 58 216 Z" fill="#c9b8fa"/>
      <rect x="46" y="86" width="108" height="18" rx="9" fill="#a78bfa"/>
      <rect x="64" y="110" width="24" height="13" rx="6" fill="#ffffff" opacity="0.25" transform="rotate(-20 64 110)"/>
      <circle cx="82" cy="152" r="7" fill="#ffffff"/>
      <circle cx="118" cy="152" r="7" fill="#ffffff"/>
      <circle cx="72" cy="170" r="9" fill="#f9c6d8" opacity="0.85"/>
      <circle cx="128" cy="170" r="9" fill="#f9c6d8" opacity="0.85"/>
      <path d="M86 174 Q100 186 114 174" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M128 190 L131 198 L139 201 L131 204 L128 212 L125 204 L117 201 L125 198 Z" fill="#ffffff" opacity="0.9"/>
    </svg>
    <div class="page-loader-text">jT Shop</div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<header class="site-header">
  <a class="brand" href="#/"><img src="logo.svg" class="brand-icon" alt="">jT <span>Shop</span></a>
  <nav class="site-nav">
    <a href="#/" data-nav="shop">Shop</a>
    <a href="#/orders" data-nav="orders" data-auth-only>My orders</a>
    <a href="admin.html" data-admin-only hidden>Admin</a>
  </nav>
  <div class="header-actions">
    <button id="cart-btn" class="icon-btn" aria-label="Cart">
      🛍️ <span id="cart-count" class="badge" hidden>0</span>
    </button>
    <span id="acct" class="acct"></span>
  </div>
</header>

<main id="app" class="app"></main>

<div id="cart-drawer" class="drawer" hidden>
  <div class="drawer-panel">
    <div class="drawer-head"><h2>Your cart</h2><button class="icon-btn" id="cart-close" aria-label="Close">✕</button></div>
    <div id="cart-body" class="drawer-body"></div>
    <div class="drawer-foot">
      <div class="cart-total"><span>Total</span><strong id="cart-total">₱0.00</strong></div>
      <button id="checkout-btn" class="btn btn-primary btn-block">Checkout</button>
    </div>
  </div>
</div>
<div id="drawer-scrim" class="scrim" hidden></div>

<footer class="site-footer">jT Shop · orders reviewed manually, delivered locally</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
