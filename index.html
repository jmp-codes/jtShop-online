<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Dove Shop</title>
<meta name="description" content="Order baby care essentials online — stock updates live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<header class="site-header">
  <a class="brand" href="#/">Little Dove <span>Shop</span></a>
  <nav class="site-nav">
    <a href="#/" data-nav="shop">Shop</a>
    <a href="#/orders" data-nav="orders" data-auth-only>My orders</a>
    <a href="#/admin" data-nav="admin" data-admin-only hidden>Admin</a>
  </nav>
  <div class="header-actions">
    <button id="cart-btn" class="icon-btn" aria-label="Cart">
      🛍️ <span id="cart-count" class="badge" hidden>0</span>
    </button>
    <span id="acct" class="acct"></span>
  </div>
</header>

<main id="app" class="app"></main>

<div id="cart-drawer" class="drawer" hidden>
  <div class="drawer-panel">
    <div class="drawer-head"><h2>Your cart</h2><button class="icon-btn" id="cart-close" aria-label="Close">✕</button></div>
    <div id="cart-body" class="drawer-body"></div>
    <div class="drawer-foot">
      <div class="cart-total"><span>Total</span><strong id="cart-total">₱0.00</strong></div>
      <button id="checkout-btn" class="btn btn-primary btn-block">Checkout</button>
    </div>
  </div>
</div>
<div id="drawer-scrim" class="scrim" hidden></div>

<footer class="site-footer">Little Dove Shop · orders reviewed manually, delivered locally</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
